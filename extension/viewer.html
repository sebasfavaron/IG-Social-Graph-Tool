<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IG Social Graph</title>
    <link rel="icon" href="icon128.png" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #fff;
        font: 13px/1.4 system-ui, sans-serif;
        color: #1b1b1b;
      }
      #graph {
        display: block;
        width: 100vw;
        height: 100vh;
        touch-action: none;
      }
      header {
        position: fixed;
        top: 10px;
        left: 10px;
        display: flex;
        flex-wrap: wrap;
        gap: 4px 10px;
        align-items: center;
        max-width: calc(100vw - 42px);
        padding: 6px 10px;
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid #e3e3e3;
        border-radius: 8px;
      }
      header > *,
      .legend [data-cat] {
        white-space: nowrap;
      }
      header .muted {
        color: #6b6b6b;
      }
      button,
      label.button {
        padding: 4px 8px;
        border-radius: 6px;
        border: 1px solid #ccc;
        background: #fff;
        font: inherit;
        cursor: pointer;
      }
      label.button input {
        display: none;
      }
      .legend [data-cat] {
        padding: 2px 6px 2px 0;
        border-radius: 4px;
        cursor: default;
      }
      .legend.active [data-cat] {
        cursor: pointer;
        color: #1b1b1b;
      }
      .legend.active [data-cat]:hover,
      .legend [data-cat].pinned {
        background: #f0f0f0;
      }
      .legend [data-cat]::before {
        content: '';
        display: inline-block;
        width: 10px;
        height: 3px;
        margin: 0 4px 2px 8px;
        background: var(--c);
      }
      .search {
        position: relative;
      }
      .search input {
        width: 110px;
        padding: 3px 8px;
        border: 1px solid transparent;
        border-radius: 6px;
        background: #f4f4f4;
        font: inherit;
        color: inherit;
        outline: none;
        transition: width 0.15s, border-color 0.15s;
      }
      .search input:focus {
        width: 180px;
        background: #fff;
        border-color: #ccc;
      }
      .search ul {
        position: absolute;
        top: calc(100% + 6px);
        left: 0;
        min-width: 100%;
        margin: 0;
        padding: 4px;
        list-style: none;
        background: #fff;
        border: 1px solid #e3e3e3;
        border-radius: 8px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      }
      .search ul[hidden] {
        display: none;
      }
      .search li {
        padding: 3px 8px;
        border-radius: 4px;
        cursor: pointer;
        white-space: nowrap;
      }
      .search li[aria-selected='true'] {
        background: #f0f0f0;
      }
      .search li mark {
        background: none;
        font-weight: 600;
        color: inherit;
      }
      #empty[hidden] {
        display: none;
      }
      #empty {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #6b6b6b;
        text-align: center;
        pointer-events: none;
      }
      #empty button,
      #empty a {
        pointer-events: auto;
      }
      #empty a {
        color: inherit;
      }
    </style>
    <script src="vendor/d3.v4.min.js"></script>
    <script src="lib/forces.js"></script>
  </head>
  <body>
    <header>
      <strong id="title">IG Social Graph</strong>
      <span id="counts" class="muted"></span>
      <div class="search">
        <input id="search" type="search" placeholder="Search  /" autocomplete="off" spellcheck="false" />
        <ul id="results" role="listbox" hidden></ul>
      </div>
      <button id="share" hidden title="Anyone with the link can see these usernames and who follows whom">Copy share link</button>
      <span id="legend" class="legend muted">
        <span id="hint">click a name to see who follows them</span
        ><span data-cat="follower" hidden style="--c: #ca2d2d">follower</span
        ><span data-cat="following" hidden style="--c: green">following</span
        ><span data-cat="mutual" hidden style="--c: purple">mutual</span>
      </span>
    </header>
    <div id="empty" hidden>
      <div>
        <p id="empty-text">No graph yet. Run a crawl from the extension popup.</p>
        <button id="example">Try an example</button>
      </div>
    </div>
    <canvas id="graph"></canvas>
    <script type="module" src="viewer.js"></script>
  </body>
</html>
