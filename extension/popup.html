<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --bg: #fff;
        --fg: #1b1b1b;
        --muted: #6b6b6b;
        --line: #e3e3e3;
        --accent: #1b1b1b;
        --accent-fg: #fff;
        --err: #c62828;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1c1c;
          --fg: #eee;
          --muted: #9a9a9a;
          --line: #333;
          --accent: #eee;
          --accent-fg: #111;
        }
      }
      body {
        width: 300px;
        margin: 0;
        padding: 14px;
        font: 13px/1.4 system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      h1 {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 15px;
        margin: 0 0 10px;
      }
      h1 span {
        display: flex;
        gap: 6px;
      }
      #update {
        flex: none;
        display: grid;
        place-items: center;
        padding: 2px 5px;
        color: var(--accent-fg);
        background: var(--accent);
        border-color: var(--accent);
      }
      /* the id rule above outranks button[hidden], so hidden needs its own */
      #update[hidden] {
        display: none;
      }
      #update svg {
        width: 14px;
        height: 14px;
      }
      #lang {
        padding: 1px 7px;
        font-size: 11px;
        font-weight: 600;
      }
      .muted {
        color: var(--muted);
      }
      .bar {
        height: 6px;
        border-radius: 3px;
        background: var(--line);
        overflow: hidden;
        margin: 8px 0;
      }
      .bar > div {
        height: 100%;
        background: var(--accent);
        width: 0;
        transition: width 0.3s;
      }
      dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 2px 10px;
        margin: 8px 0;
      }
      dt {
        color: var(--muted);
      }
      dd {
        margin: 0;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      a {
        color: inherit;
      }
      #intro {
        margin: 8px 0 0;
      }
      .error {
        color: var(--err);
        margin: 8px 0;
      }
      .row {
        display: flex;
        gap: 6px;
        margin-top: 10px;
      }
      button {
        flex: 1;
        padding: 7px 8px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--fg);
        font: inherit;
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        color: var(--accent-fg);
        border-color: var(--accent);
      }
      button[hidden] {
        display: none;
      }
      details {
        margin-top: 12px;
        border-top: 1px solid var(--line);
        padding-top: 8px;
      }
      label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 6px 0;
      }
      input[type='number'] {
        width: 70px;
        font: inherit;
        padding: 2px 4px;
        background: transparent;
        color: var(--fg);
        border: 1px solid var(--line);
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h1>
      IG Social Graph
      <span>
        <button id="update" hidden data-i18n-title="p.updateTitle" data-i18n-aria-label="p.updateTitle" title="Hay una versión nueva: descargarla" aria-label="Hay una versión nueva: descargarla">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M3 13h10" />
          </svg>
        </button>
        <button id="lang">EN</button>
      </span>
    </h1>
    <div id="status" class="muted" aria-live="polite" data-i18n="p.loading">Cargando…</div>
    <div class="bar"><div id="bar"></div></div>
    <div id="error" class="error" hidden></div>

    <!-- everything else about the crawl (start, pause, settings) is on the site -->
    <div class="row">
      <button id="view" class="primary" data-i18n="p.openSite">Abrir el sitio ↗</button>
    </div>

    <details>
      <summary class="muted" data-i18n="p.settings">Ajustes</summary>
      <div class="row"><button id="reset" data-i18n="p.reset">Borrar los datos juntados</button></div>
    </details>

    <script type="module" src="popup.js"></script>
  </body>
</html>
