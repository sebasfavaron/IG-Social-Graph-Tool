<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Social Circle Collector</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="popup-shell">
      <h1>Social Circle</h1>
      <p>Collect the current Instagram followers graph and export it as a JSON file.</p>

      <button id="collect" class="primary-button">Collect graph</button>
      <button id="open-instagram" class="secondary-button">Open Instagram</button>
      <p id="status" class="status" aria-live="polite">Ready</p>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
