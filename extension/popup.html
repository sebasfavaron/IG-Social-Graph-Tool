<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --bg: #fff;
        --fg: #1b1b1b;
        --muted: #6b6b6b;
        --line: #e3e3e3;
        --accent: #1b1b1b;
        --accent-fg: #fff;
        --err: #c62828;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1c1c;
          --fg: #eee;
          --muted: #9a9a9a;
          --line: #333;
          --accent: #eee;
          --accent-fg: #111;
        }
      }
      body {
        width: 300px;
        margin: 0;
        padding: 14px;
        font: 13px/1.4 system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      h1 {
        font-size: 15px;
        margin: 0 0 10px;
      }
      .muted {
        color: var(--muted);
      }
      .bar {
        height: 6px;
        border-radius: 3px;
        background: var(--line);
        overflow: hidden;
        margin: 8px 0;
      }
      .bar > div {
        height: 100%;
        background: var(--accent);
        width: 0;
        transition: width 0.3s;
      }
      dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 2px 10px;
        margin: 8px 0;
      }
      dt {
        color: var(--muted);
      }
      dd {
        margin: 0;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .error {
        color: var(--err);
        margin: 8px 0;
      }
      .row {
        display: flex;
        gap: 6px;
        margin-top: 10px;
      }
      button {
        flex: 1;
        padding: 7px 8px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--fg);
        font: inherit;
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        color: var(--accent-fg);
        border-color: var(--accent);
      }
      button[hidden] {
        display: none;
      }
      details {
        margin-top: 12px;
        border-top: 1px solid var(--line);
        padding-top: 8px;
      }
      label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 6px 0;
      }
      input[type='number'] {
        width: 70px;
        font: inherit;
        padding: 2px 4px;
        background: transparent;
        color: var(--fg);
        border: 1px solid var(--line);
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h1>IG Social Graph</h1>
    <div id="status" class="muted">Loading…</div>
    <div class="bar"><div id="bar"></div></div>
    <dl id="stats" hidden>
      <dt>Account</dt>
      <dd id="viewer"></dd>
      <dt>Followers checked</dt>
      <dd id="checked"></dd>
      <dt>Connections</dt>
      <dd id="links"></dd>
      <dt>Requests</dt>
      <dd id="requests"></dd>
      <dt>Time left</dt>
      <dd id="eta"></dd>
    </dl>
    <div id="error" class="error" hidden></div>

    <div class="row">
      <button id="start" class="primary">Start</button>
      <button id="resume" class="primary" hidden>Resume</button>
      <button id="pause" hidden>Pause</button>
      <button id="profiles" hidden title="Lists your followers again (about one request per 50) to pick up real names and profile photos">
        Get names &amp; photos
      </button>
    </div>
    <div class="row">
      <button id="view">View graph</button>
      <button id="share">Copy share link</button>
    </div>

    <details>
      <summary class="muted">Settings</summary>
      <label>Seconds between requests <input id="delay" type="number" min="2" max="120" value="6" /></label>
      <label>Followers to check (0 = all) <input id="max" type="number" min="0" value="0" /></label>
      <p class="muted">
        Slower is safer. Instagram limits how fast an account can browse; if it pushes back, the crawl
        waits and resumes on its own. Keep one instagram.com tab open (one is opened for you).
      </p>
      <div class="row"><button id="reset">Delete collected data</button></div>
    </details>

    <script type="module" src="popup.js"></script>
  </body>
</html>
